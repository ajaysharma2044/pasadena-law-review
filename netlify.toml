# Netlify builds the app with its Next.js runtime (the OpenNext adapter), declared below. The
# sites were first created from a branch without Next.js, so Netlify didn't detect it on its own.
# Migrations run during the build against the direct (unpooled) database connection.
[build]
  command = "npm run db:migrate && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"
